<div class="min-h-[80vh] flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 w-full max-w-sm">
    <h2 class="text-xl font-bold text-slate-800 mb-2">Acceso Administrador</h2>
    <p class="text-xs text-slate-500 mb-6">Iniciá sesión para armar equipos y cargar resultados.</p>

    @if (errorMessage()) {
      <div class="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-lg">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
        <input type="email" [(ngModel)]="email" name="email" required
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required
               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-emerald-500" />
      </div>

      <button type="submit" [disabled]="loading()"
              class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-semibold text-sm rounded-lg transition shadow-sm">
        {{ loading() ? 'Entrando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
